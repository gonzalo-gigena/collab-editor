name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # common/ (portfolio-common must be public, same owner)
      - run: cp .env.example .env
      - name: Unit tests
        run: docker run --rm -v "$PWD/apps/api:/app" -w /app node:26.13-bookworm-slim node --test
      - name: Migrations follow the lock rules
        run: sh common/scripts/check-migrations.sh
      - name: Sync tests with Postgres (two clients, oversized, malformed, persistence, 10k-edit load)
        run: |
          trap 'docker compose -f compose.yaml down -v' EXIT
          docker compose -f compose.yaml run --rm test
      - name: Stack with 3 api replicas + smoke test
        run: sh common/scripts/ci-stack.sh 3
      - name: Sync tests through Caddy, then docker compose restart sync loses no text
        run: |
          trap 'docker compose -f compose.yaml down -v' EXIT
          docker compose -f compose.yaml up -d --wait
          docker run --rm --network host -e SYNC_URL=ws://localhost:8080/ws/sync -v "$PWD/apps/sync:/app" -w /app \
            node:26.13.1-bookworm-slim npm test || { docker compose -f compose.yaml logs caddy sync; exit 1; }
          sh apps/sync/restart-check.sh || { docker compose -f compose.yaml logs sync; exit 1; }

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, sync, web]
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_ENV" # GHCR needs lowercase
      # ponytail: QEMU for arm64. Switch to native arm64 runners + manifest merge if builds get slow.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
