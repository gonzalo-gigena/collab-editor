version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: [/apps/sync, /apps/web]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/sync, /apps/web]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gitsubmodule # bumps common/ to the latest portfolio-common
    directory: /
    schedule: { interval: weekly }
